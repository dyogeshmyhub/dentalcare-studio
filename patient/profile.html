<!doctype html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Profile</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@600;700;800&display=swap" rel=stylesheet><link rel=stylesheet href="../css/style.css"><link rel=stylesheet href="../css/dashboard.css"><link rel=stylesheet href="../css/appointments.css"></head><body class=dash><aside id=side></aside><main class=main-dash><header id=top></header><section class=content><div class=title><h1>Your profile</h1><a class="btn primary" href="../appointment.html">Book appointment</a></div><form id=profile class=panel><div class=form-grid><label>Name<input id=pname></label><label>Email<input id=pemail readonly></label><label>Phone<input id=pphone></label><label>DOB<input id=pdob type=date></label></div><button class="btn primary">Save changes</button></form><div class="title profile-appointments-title"><div><h2>Booked appointments</h2><p class=muted>View your visit details, download your slip or cancel a future visit.</p></div></div><div id=profileAppointments class=stack></div></section></main><div id=toast></div><script src=../js/data.js></script><script src=../js/utils.js></script><script src=../js/dashboard.js></script><script>const renderProfileAppointments=()=>{let u=user(),appointments=get("dc_appointments").filter(a=>a.patientId===u.id);$("#profileAppointments").innerHTML=appointments.map(item).join("")||"<p class=muted>No appointments booked yet.</p>"};renderProfileAppointments();</script></body></html>
